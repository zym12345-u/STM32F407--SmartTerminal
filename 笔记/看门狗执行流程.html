<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>看门狗每一步怎么做的 · bsp_IWDG.c</title>
<style>
:root {
  color-scheme: light;
  --surface: #F7F7F8;
  --surface-muted: #EFEFF2;
  --text: #171717;
  --text-muted: #52525B;
  --border: rgba(23, 23, 23, 0.12);
  --brand: #0FDC78;
  --brand-soft: #E5FFF2;
  --brand-text: #004D26;
  --warn: #F5A524;
  --warn-soft: #FFF6E5;
  --warn-text: #7A4A00;
  --danger: #F04438;
  --danger-soft: #FEECEA;
  --danger-text: #7A1710;
  --radius: 8px;
  --radius-card: 12px;
  --spacer-4: 4px;
  --spacer-8: 8px;
  --spacer-12: 12px;
  --spacer-16: 16px;
  --spacer-20: 20px;
  --spacer-24: 24px;
  --font-sans: "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --weight-regular: 400;
  --weight-medium: 500;
  --text-caption: 12px/18px;
  --text-body: 14px/20px;
  --text-title: 16px/24px;
  --text-code: 13px/20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-widget-theme]) {
    color-scheme: dark;
    --surface: #171717;
    --surface-muted: #262626;
    --text: #E5E5E5;
    --text-muted: #A1A1AA;
    --border: rgba(229, 229, 229, 0.12);
    --brand: #32F08C;
    --brand-soft: #004D26;
    --brand-text: #E5FFF2;
    --warn: #FBBF24;
    --warn-soft: #4A2E00;
    --warn-text: #FFF6E5;
    --danger: #FB7185;
    --danger-soft: #4C1114;
    --danger-text: #FEECEA;
  }
}
* { box-sizing: border-box; }
body { margin: 0; padding: var(--spacer-24) 0; background: var(--surface); font: var(--weight-regular) var(--text-body) var(--font-sans); }
.wd-widget { max-width: 720px; margin: 0 auto; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); padding: var(--spacer-20); }
.wd-title { font: var(--weight-medium) var(--text-title) var(--font-sans); }
.wd-sub { color: var(--text-muted); font: var(--weight-regular) var(--text-caption) var(--font-sans); margin-top: var(--spacer-4); }

.wd-steps { display: flex; gap: 6px; margin-top: var(--spacer-16); }
.wd-step { flex: 1; height: 28px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); cursor: pointer; text-align: center; font: var(--weight-medium) 12px/26px var(--font-sans); color: var(--text-muted); }
.wd-step:hover { border-color: var(--brand); }
.wd-step.done { background: var(--surface-muted); }
.wd-step.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-text); }

.wd-box { margin-top: var(--spacer-16); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--spacer-12) var(--spacer-16); }
.wd-box-h { font: var(--weight-medium) var(--text-caption) var(--font-sans); color: var(--text-muted); margin-bottom: var(--spacer-8); }
.wd-box-f { margin-top: var(--spacer-8); font: var(--weight-regular) var(--text-caption) var(--font-sans); color: var(--text-muted); }
.wd-box-f b { color: var(--text); font-weight: 600; }

.wd-gauge { height: 24px; background: var(--surface-muted); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.wd-gauge-fill { height: 100%; width: 0; background: var(--brand); transition: width .2s, background .2s; }
.wd-gauge-fill.warn { background: var(--warn); }
.wd-gauge-fill.danger { background: var(--danger); }
.wd-gauge-fill.off { background: var(--surface-muted); }

.wd-beats { display: flex; gap: 6px; flex-wrap: wrap; }
.wd-beat { flex: 1 1 84px; border: 1px solid var(--border); border-radius: 6px; padding: var(--spacer-4) var(--spacer-8); background: var(--surface-muted); }
.wd-beat b { display: block; font: var(--weight-medium) 11px/16px var(--font-mono); color: var(--text-muted); }
.wd-beat span { font: var(--weight-medium) var(--text-code) var(--font-mono); }
.wd-beat.ok { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-text); }
.wd-beat.ok b { color: var(--brand-text); }
.wd-beat.bad { border-color: var(--danger); background: var(--danger-soft); color: var(--danger-text); }
.wd-beat.bad b { color: var(--danger-text); }
.wd-beat.skip { opacity: .55; }

.wd-stepname { margin-top: var(--spacer-20); font: var(--weight-medium) var(--text-title) var(--font-sans); }
.wd-stepname em { font-style: normal; color: var(--text-muted); font: var(--weight-regular) var(--text-caption) var(--font-mono); margin-left: var(--spacer-8); }
.wd-code { margin-top: var(--spacer-8); background: var(--surface-muted); border-radius: var(--radius); padding: var(--spacer-12); font: var(--weight-medium) var(--text-code) var(--font-mono); white-space: pre-wrap; word-break: break-all; }
.wd-note { margin-top: var(--spacer-8); color: var(--text-muted); font: var(--weight-regular) var(--text-caption) var(--font-sans); }
.wd-note b { color: var(--text); font-weight: 600; }

.wd-nav { display: flex; gap: var(--spacer-8); margin-top: var(--spacer-20); }
.wd-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: var(--radius); padding: var(--spacer-8) var(--spacer-16); font: var(--weight-medium) var(--text-caption) var(--font-sans); cursor: pointer; }
.wd-btn:hover:not(:disabled) { border-color: var(--brand); }
.wd-btn:disabled { opacity: .4; cursor: default; }
.wd-btn.primary { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-text); }
</style>
</head>
<body>
<div class="wd-widget">
  <div class="wd-title">看门狗每一步怎么做的</div>
  <div class="wd-sub">bsp_IWDG.c · 从开时钟到复位，共 9 步 · 点「下一步」跟着走一遍</div>

  <div class="wd-steps" id="steps"></div>

  <div class="wd-box">
    <div class="wd-box-h">IWDG 递减计数器（写一次 0xAAAA 就装回 125）</div>
    <div class="wd-gauge"><div class="wd-gauge-fill" id="gfill"></div></div>
    <div class="wd-box-f">剩余 <b id="gval">—</b> · 超时窗口 <b id="gwin">—</b></div>
  </div>

  <div class="wd-box">
    <div class="wd-box-h">9 个任务的心跳（距上次上报多久）</div>
    <div class="wd-beats" id="beats"></div>
    <div class="wd-box-f">超过 <b>3s</b> 判死线就变红 → MonitorTask 不再喂狗</div>
  </div>

  <div class="wd-stepname"><span id="sno"></span> <span id="sname"></span><em id="ssrc"></em></div>
  <div class="wd-code" id="scode"></div>
  <div class="wd-note" id="sdesc"></div>

  <div class="wd-nav">
    <button class="wd-btn" id="prev">◀ 上一步</button>
    <button class="wd-btn primary" id="next">下一步 ▶</button>
    <button class="wd-btn" id="reset">重置</button>
  </div>
</div>

<script>
(function () {
  var TASKS = ['GUI', 'SENSOR', 'WIFI', 'MODBUS', 'KEY', 'LED', 'COMMAND', 'MONITOR', 'STORAGE'];
  var MONITOR = 7;

  var STEPS = [
    {
      name: '开 LSI 时钟，等它稳定',
      src: 'bsp_IWDG.c:24-26',
      cnt: null, win: '—',
      beats: null,
      code: '__HAL_RCC_LSI_ENABLE();\nwhile (__HAL_RCC_GET_FLAG(RCC_FLAG_LSIRDY) == RESET) { }',
      desc: 'IWDG 用自己的 32kHz 低速时钟，<b>不跟 CPU 共用</b> —— 这样"晶振挂了"这种死法它也能兜住。起振要时间，不等稳定就启动，等于你以为有狗其实没有。'
    },
    {
      name: '启动看门狗',
      src: 'bsp_IWDG.c:28-29',
      cnt: 100, win: '0.5s（上电默认）',
      beats: null,
      code: 'IWDG->KR = 0xCCCCU;',
      desc: '计数器开始往下数，<b>从此关不掉</b>（除了复位）。此刻用的还是上电默认值 PR=0 / RLR=0xFFF，窗口只有 <b>0.5s</b> —— 所以下面三步必须赶紧配完，否则配置没写完就被自己咬死了。'
    },
    {
      name: '解锁并配窗口',
      src: 'bsp_IWDG.c:31-38',
      cnt: 100, win: '1.0s',
      beats: null,
      code: 'IWDG->KR  = 0x5555U;   /* 解锁，不然写不进去 */\nIWDG->PR  = 6U;        /* 分频 = 4×2^6 = 256 */\nIWDG->RLR = 125U;      /* 256×125/32000 ≈ 1.0s */',
      desc: 'PR / RLR 有写保护，得先喊 <b>0x5555</b> 这个暗号才让改 —— 防的是跑飞的代码误操作。PR 决定量程（能看多长的门），RLR 决定窗口具体多长。'
    },
    {
      name: '等寄存器同步',
      src: 'bsp_IWDG.c:40-41',
      cnt: 100, win: '1.0s',
      beats: null,
      code: 'while (IWDG->SR != 0U) { }',
      desc: 'PR / RLR 在 32kHz 时钟域，CPU 在 168MHz 域，写过去要几个 LSI 周期才搬完。SR 的 PVU / RVU 位清零才算同步完成。<br>⚠️ 这行是<b>无超时死等</b>：LSI 坏了就永远卡在这，而狗已经启动了 → 变成无限复位循环，还很难定位。'
    },
    {
      name: '首次喂狗',
      src: 'bsp_IWDG.c:43-44',
      cnt: 100, win: '1.0s',
      beats: null,
      code: 'IWDG_Refresh();   /* 内部就一句：IWDG->KR = 0xAAAAU */',
      desc: '把 RLR（125）装进递减计数器，从头开始数。初始化到此结束，剩下的交给 MonitorTask。'
    },
    {
      name: '各任务报心跳',
      src: 'bsp_IWDG.c:65-71',
      cnt: 65, win: '1.0s',
      beats: [0, 0, 0, 0, 0, 0, 0, 0, 0],
      code: 'Watchdog_Heartbeat(WDT_TASK_WIFI);\n\n/* 函数体就一行： */\ns_lastBeat[taskId] = xTaskGetTickCount();',
      desc: '每个任务在自己主循环里调一次，干的事只有一件：<b>把当前 tick 记进 s_lastBeat[id]</b>。<br>注意它<b>并不喂狗</b>，只是留个时间戳。'
    },
    {
      name: '检查 + 喂狗（正常循环）',
      src: 'bsp_IWDG.c:73-93',
      cnt: 100, win: '1.0s',
      beats: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5],
      code: 'uint8_t Watchdog_CheckAllAlive(void) {\n    for (i = 0; i < WDT_TASK_MAX; i++) {\n        if (i == WDT_TASK_MONITOR) continue;      /* 不监控自己 */\n        if (s_lastBeat[i] != 0 &&                 /* 从未上报=未启动,暂不判死 */\n            (now - s_lastBeat[i]) > pdMS_TO_TICKS(3000))\n            return 0U;                            /* 有任务卡死 */\n    }\n    return 1U;                                    /* 全活 */\n}\n\nif (Watchdog_CheckAllAlive()) { IWDG_Refresh(); }',
      desc: 'MonitorTask 每 500ms 醒一次，遍历 9 个任务但<b>跳过自己</b>。全活才喂一口 —— 计数器装回 125，重新给 1 秒。<br>正常运行就是这一步反复循环。'
    },
    {
      name: '有任务卡死 → 不喂狗',
      src: 'bsp_IWDG.c:86-90',
      cnt: 30, win: '1.0s',
      beats: [0.5, 0.5, 3.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5],
      code: '/* WIFI 已经 3.5s 没上报 */\nif (s_lastBeat[WDT_TASK_WIFI] != 0 &&\n    (now - s_lastBeat[WDT_TASK_WIFI]) > pdMS_TO_TICKS(3000))\n    return 0U;            /* 不喂 */',
      desc: 'WIFI 超过 3s 判死线 → 返回 0 → <b>不喂狗</b>。<br>关键：挂的是 WIFI 一个任务，但被"饿死"的是<b>整块板子</b> —— 这就是用一只硬件狗监控多任务的代价。'
    },
    {
      name: '计数器归零 → 复位',
      src: '硬件行为（无代码）',
      cnt: 0, win: '1.0s',
      beats: [1.5, 1.5, 4.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5],
      code: '/* 没人写 0xAAAA，计数器从 125 一路数到 0 */\n/* 约 1s 后硬件直接拉低复位脚 */',
      desc: 'IWDG 是硬件，不看谁卡死、也不听解释 —— <b>只看有没有人按时写 0xAAAA</b>。没写，就复位整个系统。'
    }
  ];

  var cur = 0;
  var el = function (id) { return document.getElementById(id); };

  var stepEls = [];
  (function () {
    var box = el('steps');
    for (var i = 0; i < STEPS.length; i++) {
      var d = document.createElement('div');
      d.className = 'wd-step';
      d.textContent = String(i + 1);
      d.setAttribute('data-i', String(i));
      box.appendChild(d);
      stepEls.push(d);
    }
    box.addEventListener('click', function (e) {
      var t = e.target;
      if (t && t.getAttribute('data-i') !== null) { cur = Number(t.getAttribute('data-i')); render(); }
    });
  })();

  function render() {
    var s = STEPS[cur], i;

    for (i = 0; i < stepEls.length; i++) {
      stepEls[i].className = 'wd-step' + (i === cur ? ' on' : (i < cur ? ' done' : ''));
    }

    var f = el('gfill');
    if (s.cnt === null) { f.className = 'wd-gauge-fill off'; f.style.width = '0%'; el('gval').textContent = '未启动'; }
    else {
      f.style.width = s.cnt + '%';
      f.className = 'wd-gauge-fill' + (s.cnt === 0 ? ' danger' : (s.cnt <= 30 ? ' warn' : ''));
      el('gval').textContent = Math.round(s.cnt * 1.25) + ' / 125';
    }
    el('gwin').textContent = s.win;

    var b = el('beats');
    b.innerHTML = '';
    for (i = 0; i < TASKS.length; i++) {
      var c = document.createElement('div');
      var v = s.beats ? s.beats[i] : null;
      if (i === MONITOR) { c.className = 'wd-beat skip'; c.innerHTML = '<b>' + TASKS[i] + '</b><span>不自检</span>'; }
      else if (v === null) { c.className = 'wd-beat'; c.innerHTML = '<b>' + TASKS[i] + '</b><span>—</span>'; }
      else {
        c.className = 'wd-beat ' + (v >= 3 ? 'bad' : 'ok');
        c.innerHTML = '<b>' + TASKS[i] + '</b><span>' + v.toFixed(1) + 's</span>';
      }
      b.appendChild(c);
    }

    el('sno').textContent = '第 ' + (cur + 1) + ' 步 ·';
    el('sname').textContent = s.name;
    el('ssrc').textContent = s.src;
    el('scode').textContent = s.code;
    el('sdesc').innerHTML = s.desc;

    el('prev').disabled = (cur === 0);
    el('next').disabled = (cur === STEPS.length - 1);
  }

  el('prev').addEventListener('click', function () { if (cur > 0) { cur--; render(); } });
  el('next').addEventListener('click', function () { if (cur < STEPS.length - 1) { cur++; render(); } });
  el('reset').addEventListener('click', function () { cur = 0; render(); });

  render();
})();
</script>
</body>
</html>
