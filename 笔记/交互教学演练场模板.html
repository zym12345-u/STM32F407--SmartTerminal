<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交互教学演练场模板 · 给小伙伴的复用说明</title>
<!--
  =====================================================================
  这份文件是"可点击状态模拟器"教学演示的通用模板。
  用法：把下面的 STATE / render() / 按钮 handler 三块改成你要教的概念，
        保留 .rb-params（参数说明区）、.rb-code（当前执行行）、.rb-note（解释）结构。
  适用场景：环形缓冲、状态机、DMA 搬运、调度器轮转、缓存淘汰……
            任何"靠文字说不清、点一下就懂"的状态变化机制。
  核心思路（4 条铁律，别破坏）：
    1. 状态只放在 JS 变量里，DOM 只负责"画"——render() 是唯一出口
    2. 每个按钮 = 一次状态推进 + 一次 render()，中间不直接改 DOM
    3. 公式区的参数必须拆成「变量名 + 含义 + 实时值」三列展示
    4. 代码区显示"刚才执行的那一行真实代码"，让用户把图和源码对上
  =====================================================================
-->
<style>
:root {
  color-scheme: light;
  --surface: #F7F7F8; --surface-muted: #EFEFF2; --text: #171717; --text-muted: #52525B;
  --border: rgba(23,23,23,.12); --brand: #0FDC78; --brand-soft: #E5FFF2; --brand-text: #004D26; --brand-on: #004D26;
  --accent: #27D2BF; --accent-soft: #EAFBF8; --accent-text: #0F766E;
  --radius: 8px; --radius-card: 12px; --radius-full: 999px;
  --spacer-4: 4px; --spacer-8: 8px; --spacer-12: 12px; --spacer-16: 16px; --spacer-20: 20px;
  --font-sans: "SF Pro Text","PingFang SC",system-ui,sans-serif; --font-mono: "JetBrains Mono",ui-monospace,monospace;
  --weight-regular: 400; --weight-medium: 500;
  --text-caption: 12px/18px; --text-body: 14px/20px; --text-title: 16px/24px; --text-code: 13px/20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-widget-theme]) {
    --surface: #171717; --surface-muted: #262626; --text: #E5E5E5; --text-muted: #A1A1AA;
    --border: rgba(229,229,229,.12); --brand: #32F08C; --brand-soft: #004D26; --brand-text: #E5FFF2;
    --accent-soft: #123F3C; --accent-text: #CCFBF1;
  }
}
* { box-sizing: border-box; }
body { margin: 0; padding: var(--spacer-24) 0; background: var(--surface); font: var(--weight-regular) var(--text-body) var(--font-sans); }
.demo { max-width: 720px; margin: 0 auto; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); padding: var(--spacer-20); }
.d-title { font: var(--weight-medium) var(--text-title) var(--font-sans); }
.d-sub { color: var(--text-muted); font: var(--weight-regular) var(--text-caption) var(--font-sans); margin-top: var(--spacer-4); }
.d-legend { display: flex; gap: var(--spacer-16); margin-top: var(--spacer-12); flex-wrap: wrap; }
.d-chip { font: var(--weight-medium) var(--text-caption) var(--font-sans); border-radius: var(--radius-full); padding: 0 var(--spacer-8); line-height: 18px; }
.d-chip-a { background: var(--brand); color: var(--brand-on); }
.d-chip-b { background: var(--accent-soft); color: var(--accent-text); border: 1px solid var(--accent); }
.d-legend-note { color: var(--text-muted); font: var(--weight-regular) var(--text-caption) var(--font-sans); }
/* 可视化区：换成你要教的东西（缓冲格、状态圆圈、队列……） */
.d-stage { margin: var(--spacer-16) 0; display: flex; gap: var(--spacer-8); flex-wrap: wrap; }
.d-cell { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
  font: var(--weight-medium) var(--text-code) var(--font-mono); }
.d-cell.filled { background: var(--surface-muted); }
/* 代码区：显示"刚才执行的那一行" */
.d-code { margin-top: var(--spacer-12); background: var(--surface-muted); border-radius: var(--radius);
  padding: var(--spacer-12); font: var(--weight-medium) var(--text-code) var(--font-mono); white-space: pre-wrap; word-break: break-all; }
.d-note { margin-top: var(--spacer-4); color: var(--text-muted); font: var(--weight-regular) var(--text-caption) var(--font-sans); }
/* 状态行 + 参数说明区（最关键：把公式里的变量拆出来） */
.d-status { margin-top: var(--spacer-12); display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: var(--spacer-8); }
.d-count { font: var(--weight-medium) var(--text-code) var(--font-mono); }
.d-state { color: var(--text-muted); font: var(--weight-regular) var(--text-caption) var(--font-sans); }
.d-params { margin-top: var(--spacer-16); background: var(--surface-muted); border: 1px solid var(--border);
  border-radius: var(--radius); padding: var(--spacer-12) var(--spacer-16); }
.d-params-title { font: var(--weight-medium) var(--text-caption) var(--font-sans); color: var(--text-muted); margin-bottom: var(--spacer-8); }
.d-param-row { display: flex; align-items: baseline; gap: var(--spacer-12); margin: var(--spacer-4) 0; flex-wrap: wrap; }
.d-param-name { font: var(--weight-medium) var(--text-code) var(--font-mono); min-width: 56px; }
.d-param-name.a { color: var(--brand); } .d-param-name.b { color: var(--accent); }
.d-param-desc { color: var(--text-muted); font: var(--weight-regular) var(--text-caption) var(--font-sans); }
.d-param-val { font: var(--weight-medium) var(--text-code) var(--font-mono); margin-left: auto; }
.d-formula { margin-top: var(--spacer-8); font: var(--weight-medium) var(--text-code) var(--font-mono); color: var(--text); }
.d-formula .v-a { color: var(--brand); font-weight: 600; } .d-formula .v-b { color: var(--accent); font-weight: 600; }
/* 按钮区 */
.d-btns { margin-top: var(--spacer-12); display: flex; gap: var(--spacer-8); flex-wrap: wrap; }
.d-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: var(--radius);
  padding: var(--spacer-8) var(--spacer-12); font: var(--weight-medium) var(--text-body) var(--font-sans); cursor: pointer; }
.d-btn:hover { border-color: var(--brand); }
.d-btn-primary { border-color: var(--brand); color: var(--brand-text); }
.d-tip { margin-top: var(--spacer-12); color: var(--text-muted); font: var(--weight-regular) var(--text-caption) var(--font-sans);
  border-top: 1px solid var(--border); padding-top: var(--spacer-12); }
</style>
</head>
<body>
<div class="demo">
  <div class="d-title">【模板】可点击状态模拟器</div>
  <div class="d-sub">把下面 3 处改成你的概念，其余结构照抄即可</div>

  <!-- 图例：颜色和变量要对应 -->
  <div class="d-legend">
    <span><span class="d-chip d-chip-a">A</span> <span class="d-legend-note">变量 A（生产者/写）</span></span>
    <span><span class="d-chip d-chip-b">B</span> <span class="d-legend-note">变量 B（消费者/读）</span></span>
  </div>

  <!-- ① 可视化区：换成你要教的东西 -->
  <div class="d-stage" id="stage"></div>

  <!-- ② 当前执行行（让用户把图和源码对上） -->
  <div class="d-code" id="code">/* 点按钮，这里会显示刚执行的那一行代码 */</div>
  <div class="d-note" id="note">一句话解释这行代码干了什么</div>

  <!-- 状态行 + ③ 参数说明区（公式变量拆出来） -->
  <div class="d-status">
    <span class="d-count" id="count">公式 = ...</span>
    <span class="d-state" id="state">状态</span>
  </div>
  <div class="d-params">
    <div class="d-params-title">公式参数说明</div>
    <div class="d-param-row">
      <span class="d-param-name a">a</span><span class="d-param-desc">变量 a 的含义</span><span class="d-param-val" data-var="a">0</span>
    </div>
    <div class="d-param-row">
      <span class="d-param-name b">b</span><span class="d-param-desc">变量 b 的含义</span><span class="d-param-val" data-var="b">0</span>
    </div>
    <div class="d-formula">result = (<span class="v-a">a</span> + N − <span class="v-b">b</span>) % N</div>
  </div>

  <!-- 按钮区：每个按钮 = 一次状态推进 -->
  <div class="d-btns">
    <button class="d-btn d-btn-primary" data-act="a">推进 A</button>
    <button class="d-btn" data-act="b">推进 B</button>
    <button class="d-btn" data-act="reset">复位</button>
  </div>
  <div class="d-tip">给用户的复习路径：①先看参数说明；②点主按钮观察状态变化；③对照代码区读源码；④点复位重来。</div>
</div>

<script>
/* =====================================================================
   改这 3 块就行：
     1. STATE（状态变量）
     2. render()（怎么把状态画到 DOM）
     3. 按钮 handler（每个按钮推进哪些状态、显示哪行代码）
   其余（参数区联动、颜色 token、按钮绑定）不用动。
   ===================================================================== */

// ① 状态变量
var N = 8;
var a = 0, b = 0;
var cells = [];

var stage = document.getElementById('stage');
var codeEl = document.getElementById('code');
var noteEl = document.getElementById('note');
var countEl = document.getElementById('count');
var stateEl = document.getElementById('state');

// 初始化可视化区（这里用 8 个格子当例子，换成你的东西）
for (var i = 0; i < N; i++) {
  var c = document.createElement('div');
  c.className = 'd-cell';
  stage.appendChild(c);
  cells.push(c);
}

// ② render：把状态画出来（唯一出口）
function render() {
  for (var i = 0; i < N; i++) {
    cells[i].textContent = (i === a) ? 'A' : (i === b) ? 'B' : '';
    cells[i].classList.toggle('filled', i >= Math.min(a,b) && i < Math.max(a,b));
  }
  var result = (a + N - b) % N;
  countEl.textContent = 'result = (' + a + ' + 8 − ' + b + ') % 8 = ' + result;
  stateEl.textContent = result === 0 ? '空' : (result === N-1 ? '满' : '有数据');
  // 参数区实时值联动
  document.querySelector('[data-var="a"]').textContent = a;
  document.querySelector('[data-var="b"]').textContent = b;
}

// ③ 按钮 handler：推进状态 + 设置代码区/注释 + render
function setCode(code, note) { codeEl.textContent = code; noteEl.textContent = note; }

document.querySelector('[data-act="a"]').addEventListener('click', function () {
  a = (a + 1) % N;
  setCode('a = (a + 1) % N;  → a = ' + a, '生产者 A 前进一格，回绕靠取模');
  render();
});
document.querySelector('[data-act="b"]').addEventListener('click', function () {
  b = (b + 1) % N;
  setCode('b = (b + 1) % N;  → b = ' + b, '消费者 B 追 A');
  render();
});
document.querySelector('[data-act="reset"]').addEventListener('click', function () {
  a = 0; b = 0;
  setCode('/* reset */', '状态归零');
  render();
});

render();
</script>
</body>
</html>
