<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>看门狗心跳空窗演练场</title>
<style>
:root {
  color-scheme: light;
  --surface: #F7F7F8;
  --surface-muted: #EFEFF2;
  --text: #171717;
  --text-muted: #52525B;
  --border: rgba(23, 23, 23, 0.12);
  --brand: #0FDC78;
  --brand-soft: #E5FFF2;
  --brand-text: #004D26;
  --brand-on: #004D26;
  --accent: #27D2BF;
  --accent-soft: #EAFBF8;
  --accent-text: #0F766E;
  --warn: #F5A524;
  --warn-soft: #FFF6E5;
  --warn-text: #7A4A00;
  --danger: #F04438;
  --danger-soft: #FEECEA;
  --danger-text: #7A1710;
  --frozen: #8B5CF6;
  --frozen-soft: #F3EBFF;
  --frozen-text: #4C1D95;
  --radius: 8px;
  --radius-card: 12px;
  --radius-full: 999px;
  --spacer-4: 4px;
  --spacer-8: 8px;
  --spacer-12: 12px;
  --spacer-16: 16px;
  --spacer-20: 20px;
  --spacer-24: 24px;
  --font-sans: "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --weight-regular: 400;
  --weight-medium: 500;
  --text-caption: 12px/18px;
  --text-body: 14px/20px;
  --text-title: 16px/24px;
  --text-code: 13px/20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-widget-theme]) {
    color-scheme: dark;
    --surface: #171717;
    --surface-muted: #262626;
    --text: #E5E5E5;
    --text-muted: #A1A1AA;
    --border: rgba(229, 229, 229, 0.12);
    --brand: #32F08C;
    --brand-soft: #004D26;
    --brand-text: #E5FFF2;
    --brand-on: #052E16;
    --warn: #FBBF24;
    --warn-soft: #4A2E00;
    --warn-text: #FFF6E5;
    --danger: #FB7185;
    --danger-soft: #4C1114;
    --danger-text: #FEECEA;
    --frozen: #A78BFA;
    --frozen-soft: #2E1065;
    --frozen-text: #F3EBFF;
    --accent-soft: #123F3C;
    --accent-text: #CCFBF1;
  }
}
* { box-sizing: border-box; }
body { margin: 0; padding: var(--spacer-24) 0; background: var(--surface); font: var(--weight-regular) var(--text-body) var(--font-sans); }
.wd-widget { max-width: 760px; margin: 0 auto; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); padding: var(--spacer-20); }
.wd-title { font: var(--weight-medium) var(--text-title) var(--font-sans); }
.wd-sub { color: var(--text-muted); font: var(--weight-regular) var(--text-caption) var(--font-sans); margin-top: var(--spacer-4); }

.wd-btns { display: flex; gap: var(--spacer-8); flex-wrap: wrap; }
.wd-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: var(--radius); padding: var(--spacer-8) var(--spacer-12); font: var(--weight-medium) var(--text-caption) var(--font-sans); cursor: pointer; transition: border-color .12s, background .12s; text-align: left; }
.wd-btn:hover { border-color: var(--brand); }
.wd-btn.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-text); }
.wd-btn.preset { border-style: dashed; }
.wd-btn.big { flex: 1 1 260px; padding: var(--spacer-16); font: var(--weight-medium) var(--text-body) var(--font-sans); }
.wd-btn.big small { display: block; margin-top: var(--spacer-4); font: var(--weight-regular) var(--text-caption) var(--font-sans); color: var(--text-muted); }
.wd-btn.big.on small { color: var(--brand-text); }

.wd-sec { margin-top: var(--spacer-16); }
.wd-sec-title { font: var(--weight-medium) var(--text-caption) var(--font-sans); color: var(--text-muted); margin-bottom: var(--spacer-8); }

.wd-legend { display: flex; gap: var(--spacer-12); flex-wrap: wrap; align-items: center; margin-top: var(--spacer-8); }
.wd-chip { font: var(--weight-medium) var(--text-caption) var(--font-sans); border-radius: var(--radius-full); padding: 0 var(--spacer-8); line-height: 18px; display: inline-block; }

.wd-tl { margin-top: var(--spacer-20); }
.wd-tl-row { display: flex; align-items: center; gap: var(--spacer-8); }
.wd-tl-label { width: 44px; flex: none; color: var(--text-muted); font: var(--weight-medium) var(--text-caption) var(--font-sans); text-align: right; }
.wd-strip { flex: 1; display: flex; gap: 1px; }
.wd-cell { flex: 1; height: 22px; border-radius: 2px; background: var(--surface-muted); border: 1px solid transparent; }
.wd-cell.p-run { background: var(--surface-muted); }
.wd-cell.p-block { background: var(--warn-soft); border-color: var(--warn); }
.wd-cell.p-delay { background: var(--surface); border-color: var(--border); }
.wd-cell.p-call { background: var(--accent-soft); border-color: var(--accent); }
.wd-cell.p-freeze { background: var(--frozen-soft); border-color: var(--frozen); }
.wd-cell.beat { background: var(--brand); border-color: var(--brand); }
.wd-cell.dead { background: var(--danger-soft); border-color: var(--danger); }
.wd-cell.reset { background: var(--danger); border-color: var(--danger); }
.wd-axis { flex: 1; display: flex; justify-content: space-between; margin-top: var(--spacer-4); color: var(--text-muted); font: var(--weight-regular) var(--text-caption) var(--font-mono); }

.wd-result { margin-top: var(--spacer-20); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--spacer-12) var(--spacer-16); display: flex; gap: var(--spacer-16); flex-wrap: wrap; align-items: baseline; }
.wd-verdict { font: var(--weight-medium) var(--text-title) var(--font-sans); }
.wd-verdict.ok { color: var(--brand-text); }
.wd-verdict.bad { color: var(--danger-text); }
.wd-metric { font: var(--weight-medium) var(--text-code) var(--font-mono); }
.wd-metric .k { color: var(--text-muted); font-weight: 400; }

.wd-code { margin-top: var(--spacer-16); background: var(--surface-muted); border-radius: var(--radius); padding: var(--spacer-12); font: var(--weight-medium) var(--text-code) var(--font-mono); white-space: pre-wrap; word-break: break-all; }
.wd-note { margin-top: var(--spacer-8); color: var(--text-muted); font: var(--weight-regular) var(--text-caption) var(--font-sans); }
.wd-note b { color: var(--text); font-weight: 600; }
.wd-note code { font: var(--weight-medium) var(--text-code) var(--font-mono); }

.wd-more { margin-top: var(--spacer-20); border-top: 1px solid var(--border); padding-top: var(--spacer-12); }
.wd-more summary { cursor: pointer; color: var(--text-muted); font: var(--weight-medium) var(--text-caption) var(--font-sans); list-style: none; }
.wd-more summary::-webkit-details-marker { display: none; }
.wd-more summary::before { content: "▸ "; }
.wd-more[open] summary::before { content: "▾ "; }
.wd-more summary:hover { color: var(--text); }
</style>
</head>
<body>
<div class="wd-widget">
  <div class="wd-title">看门狗心跳空窗演练场</div>
  <div class="wd-sub">一条 30 秒时间带，每格 0.5 秒 · <b>黄段 = 任务卡住</b> · <b>绿格 = 报了一次平安</b> · 超 3 秒没报就复位</div>

  <div class="wd-btns" id="main" style="margin-top:var(--spacer-16)">
    <button class="wd-btn big" data-block="2" data-inject="0" data-window="1000">
      有问题：循环里没报平安
      <small>V1.1.0 —— 等 AT 响应的 20 秒里一次心跳都没有</small>
    </button>
    <button class="wd-btn big" data-block="2" data-inject="3" data-window="1000">
      修好：入口必报 + 循环节流
      <small>V1.1.3 的写法 —— 循环里每 500ms 补报一次</small>
    </button>
  </div>

  <div class="wd-tl">
    <div class="wd-legend">
      <span><span class="wd-chip" style="background:var(--warn-soft);color:var(--warn-text);border:1px solid var(--warn)">卡住</span></span>
      <span><span class="wd-chip" style="background:var(--accent-soft);color:var(--accent-text);border:1px solid var(--accent)">快调用</span></span>
      <span><span class="wd-chip" style="background:var(--frozen-soft);color:var(--frozen-text);border:1px solid var(--frozen)">冻结</span></span>
      <span><span class="wd-chip" style="background:var(--brand);color:var(--brand-on)">报平安</span></span>
      <span><span class="wd-chip" style="background:var(--danger-soft);color:var(--danger-text);border:1px solid var(--danger)">已判死</span></span>
      <span><span class="wd-chip" style="background:var(--danger);color:#fff">复位</span></span>
    </div>

    <div class="wd-tl-row" style="margin-top:8px">
      <span class="wd-tl-label">阶段</span>
      <div class="wd-strip" id="stripPhase"></div>
    </div>
    <div class="wd-tl-row" style="margin-top:4px">
      <span class="wd-tl-label">心跳</span>
      <div class="wd-strip" id="stripBeat"></div>
    </div>
    <div class="wd-tl-row">
      <span class="wd-tl-label"></span>
      <div class="wd-axis"><span>0s</span><span>5s</span><span>10s</span><span>15s</span><span>20s</span><span>25s</span><span>30s</span></div>
    </div>
  </div>

  <div class="wd-result">
    <span class="wd-verdict" id="verdict">—</span>
    <span class="wd-metric"><span class="k">最长没报平安</span> <span id="mGap">—</span></span>
    <span class="wd-metric"><span class="k">判死时刻</span> <span id="mStuck">—</span></span>
  </div>

  <div class="wd-code" id="code">/* 点上面任意一个按钮 */</div>
  <div class="wd-note" id="note"></div>

  <details class="wd-more">
    <summary>展开：其余版本 + 自己搭配参数</summary>

    <div class="wd-sec">
      <div class="wd-sec-title">其余 6 个版本</div>
      <div class="wd-btns" id="presets">
        <button class="wd-btn preset" data-block="2" data-inject="0" data-window="1000">V1.1.0 初始缺陷</button>
        <button class="wd-btn preset" data-block="2" data-inject="0" data-window="4000">V1.1.1 放宽 RLR</button>
        <button class="wd-btn preset" data-block="2" data-inject="1" data-window="1000">V1.1.2 循环节流</button>
        <button class="wd-btn preset" data-block="3" data-inject="1" data-window="1000">V1.1.2 死在快响应</button>
        <button class="wd-btn preset" data-block="3" data-inject="3" data-window="1000">V1.1.3 最终正解</button>
        <button class="wd-btn preset" data-block="4" data-inject="3" data-window="1000">擦除冻结·未放宽</button>
        <button class="wd-btn preset" data-block="4" data-inject="3" data-window="4000">擦除冻结·V1.1.1</button>
      </div>
    </div>

    <div class="wd-sec">
      <div class="wd-sec-title">自己搭配 · 阻塞形态</div>
      <div class="wd-btns" data-group="block">
        <button class="wd-btn" data-v="1">正常主循环</button>
        <button class="wd-btn" data-v="2">CWJAP 20s 长等待</button>
        <button class="wd-btn" data-v="3">SNTP 轮询（1s 延时 + 0.1s 快调用）</button>
        <button class="wd-btn" data-v="4">内部 Flash 擦除冻结 2s</button>
      </div>
    </div>

    <div class="wd-sec">
      <div class="wd-sec-title">自己搭配 · 喂狗策略</div>
      <div class="wd-btns" data-group="inject">
        <button class="wd-btn" data-v="0">无</button>
        <button class="wd-btn" data-v="1">循环内节流（满 500ms 才报）</button>
        <button class="wd-btn" data-v="2">入口必报</button>
        <button class="wd-btn" data-v="3">入口必报 + 循环节流</button>
      </div>
    </div>

    <div class="wd-sec">
      <div class="wd-sec-title">自己搭配 · IWDG 窗口</div>
      <div class="wd-btns" data-group="window">
        <button class="wd-btn" data-v="1000">1s（RLR=125）</button>
        <button class="wd-btn" data-v="4000">4s（RLR=500）</button>
      </div>
    </div>
  </details>
</div>

<script>
(function () {
  var HORIZON = 30000, TICK = 100, CELL = 500, NCELL = HORIZON / CELL;
  var DEADLINE = 3000;

  var cfg = { block: 2, inject: 0, window: 1000 };
  var phaseCells = [], beatCells = [];
  var stripPhase = document.getElementById('stripPhase');
  var stripBeat = document.getElementById('stripBeat');
  var i;
  for (i = 0; i < NCELL; i++) { var a = document.createElement('div'); a.className = 'wd-cell'; stripPhase.appendChild(a); phaseCells.push(a); }
  for (i = 0; i < NCELL; i++) { var b = document.createElement('div'); b.className = 'wd-cell'; stripBeat.appendChild(b); beatCells.push(b); }

  function phaseOf(t) {
    if (cfg.block === 2) return (t >= 2000 && t < 22000) ? 'block' : 'run';
    if (cfg.block === 3) return (t % 1100 >= 1000) ? 'call' : 'delay';
    if (cfg.block === 4) return (t >= 2000 && t < 4000) ? 'freeze' : 'run';
    return 'run';
  }

  /* 该 tick 是否报一次平安 */
  function beats(t, ph, lastBeat) {
    if (ph === 'freeze') return false;           /* CPU 停取指,代码跑不了 */
    if (ph === 'run') return true;               /* 正常主循环每轮都报 */
    if (ph === 'block') {                        /* 单次长阻塞 */
      if (cfg.inject === 1 || cfg.inject === 3) return (t - lastBeat) >= 500;
      if (cfg.inject === 2) return t === 2000;   /* 只在入口报一次 */
      return false;
    }
    if (ph === 'call') {                         /* 0.1s 快调用 */
      return (cfg.inject === 2 || cfg.inject === 3);  /* 入口必报才有效;节流在 0.1s 内触发不了 */
    }
    return false;                                /* osDelay 段 */
  }

  function simulate() {
    var lastBeat = 0, feed = 0, stuck = false, stuckAt = -1;
    var maxGap = 0, reset = false, resetAt = -1;
    var beatFlags = [], deadFlags = [], phaseFlags = [], k;
    for (k = 0; k < NCELL; k++) { beatFlags.push(false); deadFlags.push(false); phaseFlags.push('run'); }

    for (var t = 0; t < HORIZON; t += TICK) {
      var ph = phaseOf(t);
      var hit = beats(t, ph, lastBeat);
      if (hit) { if (t - lastBeat > maxGap) maxGap = t - lastBeat; lastBeat = t; }

      var isCheck = (t % 500 === 0) && t > 0;
      if (isCheck && !stuck && ph !== 'freeze') {   /* 冻结时 MonitorTask 也跑不了 */
        if (t - lastBeat >= DEADLINE) { stuck = true; stuckAt = t; }
        else feed = t;
      }
      if (!reset && (t - feed) >= cfg.window) { reset = true; resetAt = t; }

      var c = Math.floor(t / CELL);
      if (c < NCELL) {
        if (hit) beatFlags[c] = true;
        /* 0.1s 的快调用在 500ms 粒度下容易被 delay 覆盖,让它优先占位 */
        if (ph === 'call') phaseFlags[c] = 'call';
        else if (ph !== 'run' && phaseFlags[c] === 'run') phaseFlags[c] = ph;
        if (stuck) deadFlags[c] = true;
      }
      if (reset) break;
    }
    /* 收尾:最后一段没被任何心跳终结的空窗必须计入 */
    var endT = reset ? resetAt : HORIZON;
    if ((endT - lastBeat) > maxGap) maxGap = endT - lastBeat;

    return { maxGap: maxGap, stuck: stuck, stuckAt: stuckAt, reset: reset, resetAt: resetAt,
             beatFlags: beatFlags, deadFlags: deadFlags, phaseFlags: phaseFlags };
  }

  var CODE = {
    0: '/* V1.1.0 缺陷版:等待循环里一次平安都没报 */\nwhile (!matched && timeout--) {\n    /* ... 收一字节、比对 ... */\n}',
    1: '/* 循环内节流补报 */\nwhile (!matched && timeout--) {\n    if (HAL_GetTick() - lastHb >= 500U) {\n        Watchdog_Heartbeat(WDT_TASK_WIFI);\n        lastHb = HAL_GetTick();\n    }\n    osDelay(1);\n}',
    2: '/* 入口必报(单用撑不过长等待) */\nvoid ESP8266_Cmd(...) {\n    Watchdog_Heartbeat(WDT_TASK_WIFI);   /* 只在进入调用的那一瞬报一次 */\n    while (!matched && timeout--) { ... }\n}',
    3: '/* V1.1.3 正解:入口必报 + 长循环节流 */\nvoid ESP8266_Cmd(...) {\n    Watchdog_Heartbeat(WDT_TASK_WIFI);        /* ① 入口必报:防快响应零心跳 */\n    while (!matched && timeout--) {\n        if (HAL_GetTick() - lastHb >= 500U) { /* ② 节流补报:防单次长调用 */\n            Watchdog_Heartbeat(WDT_TASK_WIFI);\n            lastHb = HAL_GetTick();\n        }\n        osDelay(1);\n    }\n}'
  };

  function noteFor(r) {
    if (cfg.block === 4) {
      if (r.reset) {
        return '<b>冻结期 CPU 停取指</b>，喂狗代码执行不到，喂狗策略选什么都一样。窗口 1s 撑不过 2s 冻结 → 复位。<br>'
             + '注意此刻最长空窗仅 ' + (r.maxGap / 1000).toFixed(1) + 's，<b>远小于 3s 判死线</b> —— 挂的不是 WifiTask，是 MonitorTask 自己被冻住、没法喂狗。';
      }
      return '<b>冻结期 CPU 停取指</b>，喂狗代码执行不到 —— 只有放宽到 4s 才活得下来，<b>V1.1.1 在这一层是真解</b>。';
    }
    if (cfg.block === 3 && (cfg.inject === 0 || cfg.inject === 1)) {
      return '<b>反直觉点</b>：每次 AT 调用只有 0.1s，节流门槛 500ms 永远够不着 → 整次调用零心跳。<br>'
           + '慢响应能过、快响应反而挂 —— 同一份代码，换个场景就翻车。';
    }
    if (cfg.block === 2 && cfg.inject === 0) {
      return '等 AT 响应的 20 秒里<b>一次平安都没报</b> —— 黄段里一个绿格子都没有，空窗 '
           + (r.maxGap / 1000).toFixed(1) + 's 远超 3s 判死线 → 停止喂狗 → 复位。';
    }
    if (cfg.block === 2 && cfg.inject === 2) {
      return '入口必报只在进入调用的那一瞬报一次，<b>撑不过 20s 长等待</b> —— 长循环还得靠节流补报。';
    }
    if (r.reset && cfg.window === 4000) {
      return '<b>放宽窗口治不了根因</b>：任务已被判死、MonitorTask 已停喂，改窗口只是把复位时间往后推。';
    }
    if (r.reset) return '空窗越过了 3s 判死线 → MonitorTask 停喂 → IWDG 归零。';
    return '黄段里<b>每 0.5s 就有一个绿格子</b>，最长空窗 ' + (r.maxGap / 1000).toFixed(1) + 's &lt; 判死线 3s，存活。';
  }

  function render() {
    var r = simulate(), k;
    for (k = 0; k < NCELL; k++) {
      phaseCells[k].className = 'wd-cell p-' + r.phaseFlags[k];
      var cls = 'wd-cell';
      if (r.beatFlags[k]) cls += ' beat';
      else if (r.deadFlags[k]) cls += ' dead';
      beatCells[k].className = cls;
    }
    if (r.reset) {
      var rc = Math.floor(r.resetAt / CELL);
      if (rc < NCELL) beatCells[rc].className = 'wd-cell reset';
    }

    var v = document.getElementById('verdict');
    if (r.reset) { v.textContent = '❌ 复位 @ ' + (r.resetAt / 1000).toFixed(1) + 's'; v.className = 'wd-verdict bad'; }
    else { v.textContent = '✅ 存活（30s 没复位）'; v.className = 'wd-verdict ok'; }

    document.getElementById('mGap').textContent = (r.maxGap / 1000).toFixed(1) + ' s';
    document.getElementById('mStuck').textContent = r.stuck ? (r.stuckAt / 1000).toFixed(1) + ' s' : '没判死';
    document.getElementById('code').textContent = CODE[cfg.inject];
    document.getElementById('note').innerHTML = noteFor(r);
  }

  function syncButtons() {
    var groups = document.querySelectorAll('[data-group]'), g, j, bs;
    for (g = 0; g < groups.length; g++) {
      var name = groups[g].getAttribute('data-group');
      bs = groups[g].querySelectorAll('.wd-btn');
      for (j = 0; j < bs.length; j++) {
        bs[j].classList.toggle('on', Number(bs[j].getAttribute('data-v')) === cfg[name]);
      }
    }
    var ps = document.querySelectorAll('[data-block]');
    for (j = 0; j < ps.length; j++) {
      var on = Number(ps[j].getAttribute('data-block')) === cfg.block
            && Number(ps[j].getAttribute('data-inject')) === cfg.inject
            && Number(ps[j].getAttribute('data-window')) === cfg.window;
      ps[j].classList.toggle('on', on);
    }
  }

  function apply(btn) {
    cfg.block = Number(btn.getAttribute('data-block'));
    cfg.inject = Number(btn.getAttribute('data-inject'));
    cfg.window = Number(btn.getAttribute('data-window'));
    syncButtons(); render();
  }
  function bindPreset(id) {
    document.getElementById(id).addEventListener('click', function (e) {
      var btn = e.target.closest('.wd-btn');
      if (btn) apply(btn);
    });
  }
  bindPreset('main');
  bindPreset('presets');

  var groups = document.querySelectorAll('[data-group]');
  for (var g = 0; g < groups.length; g++) {
    (function (grp) {
      var name = grp.getAttribute('data-group');
      grp.addEventListener('click', function (e) {
        var btn = e.target.closest('.wd-btn');
        if (!btn) return;
        cfg[name] = Number(btn.getAttribute('data-v'));
        syncButtons(); render();
      });
    })(groups[g]);
  }

  syncButtons(); render();
})();
</script>
</body>
</html>
